name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: contract tests
        run: python -m unittest discover -s tests -v
      - name: replay the proven fixture
        run: python scripts/prove.py examples/proven.md --run
